
<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Ciatta's Magic World</title>

    <!-- ICONS: Font Awesome -->
    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Inter, "Segoe UI", Arial, sans-serif;
            background: #f5f7fb;
            color: #263149;
            min-height: 100vh;
        }

        /* HEADER */

        header {
            max-width: 1050px;
            margin: auto;
            padding: 80px 25px 40px;
        }

        .tag {
            color: #6478d3;
            text-transform: uppercase;
            letter-spacing: 3px;
            font-size: 12px;
            font-weight: 700;
            margin-bottom: 20px;
        }

        h1 {
            font-size: clamp(40px, 6vw, 68px);
            letter-spacing: -3px;
            margin-bottom: 15px;
            color: #263149;
        }

        h1 span {
            color: #8094ed;
        }

        .subtitle {
            color: #7c879b;
            font-size: 16px;
            line-height: 1.8;
            max-width: 600px;
        }

        /* PROJECT GRID */

        main {
            max-width: 1050px;
            margin: auto;
            padding: 20px 25px 80px;
        }

        .projects {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 22px;
        }

        /* CARDS */

        .card {
            background: #ffffff;
            border: 1px solid #e7eaf1;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 4px 15px rgba(30, 45, 80, 0.03);
            transition: all 0.25s ease;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 28px rgba(30, 45, 80, 0.08);
            border-color: #d4dcfa;
        }

        /* ICONS */

        .icon-box {
            width: 55px;
            height: 55px;
            border-radius: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            margin-bottom: 22px;
        }

        .icon-blue {
            background: #e9eeff;
            color: #6478d3;
        }

        .icon-green {
            background: #e1f5ed;
            color: #399879;
        }

        .icon-orange {
            background: #fff1df;
            color: #d28b3c;
        }

        .icon-purple {
            background: #f3e8fb;
            color: #a36bc1;
        }

        .icon-pink {
            background: #fde9f0;
            color: #d27499;
        }

        .icon-cyan {
            background: #e1f5fa;
            color: #399db8;
        }

        /* TEXT */

        .category {
            font-size: 11px;
            letter-spacing: 1.8px;
            font-weight: 700;
            margin-bottom: 10px;
            text-transform: uppercase;
        }

        .card h2 {
            font-size: 22px;
            margin-bottom: 12px;
            color: #263149;
        }

        .card p {
            color: #8490a4;
            font-size: 14px;
            line-height: 1.8;
            min-height: 50px;
        }

        /* LINK */

        .card a {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin-top: 25px;
            text-decoration: none;
            color: #6478d3;
            font-size: 14px;
            font-weight: 600;
        }

        .card a i {
            transition: transform 0.2s ease;
        }

        .card a:hover i {
            transform: translate(4px, -4px);
        }

        /* FOOTER */

        footer {
            border-top: 1px solid #e7eaf1;
            text-align: center;
            padding: 25px;
            color: #a0a9b8;
            font-size: 12px;
        }

        /* MOBILE */

        @media (max-width: 650px) {
            header {
                padding-top: 55px;
            }

            .projects {
                grid-template-columns: 1fr;
            }

            h1 {
                letter-spacing: -2px;
            }

            .card {
                padding: 25px;
            }
        }
    </style>
</head>

<body>

    <header>
        <div class="tag">Ciatta's stuff</div>

        <h1>GDR<span>.</span></h1>

        <p class="subtitle">
            Wiki, documenti, informazioni e tutto il necessario per le mie (circa) campagne di GDR che non so dove altro mettere
        </p>
    </header>

    <main>
        <div class="projects">

            <!-- PROJECT 1 -->
            <div class="card">

                <div class="icon-box icon-blue">
                    🃏
                </div>

                <div class="category" style="color:#6478d3;">
                    D&D
                </div>
                <h2>XXIII:Card of the Unknown</h2>
                <a href="card/index.html" target="_blank"
                   rel="noopener noreferrer">
                    Esplora il mondo <i class="fa-solid fa-arrow-up-right-from-square"></i>
                </a>
            </div>


            <!-- PROJECT 2 -->
            <div class="card">
                <div class="icon-box icon-green">
                    <i class="fa-solid fa-code"></i>
                </div>
                <div class="category" style="color:#399879;">
                    D&D
                </div>
                <h2>Campagna nuova</h2>
                <a href="foo/index.html" target="_blank"
                   rel="noopener noreferrer">
                     Esplora il mondo <i class="fa-solid fa-arrow-up-right-from-square"></i>
                </a>
            </div>


           

        </div>
    </main>

    <footer>
        My Projects · 2026
    </footer>

</body>
</html>
