
<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Campagna Nuova</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Inter, "Segoe UI", Arial, sans-serif;
    background: #f5f7fb;
    color: #263149;
    min-height: 100vh;
}

/* HEADER */

header {
    max-width: 1050px;
    margin: auto;
    padding: 80px 25px 40px;
}

.tag {
    color: #6478d3;
    text-transform: uppercase;
    letter-spacing: 3px;
    font-size: 12px;
    font-weight: 700;
    margin-bottom: 20px;
}

h1 {
    font-size: clamp(28px, 4vw, 48px);
    letter-spacing: -3px;
    margin-bottom: 15px;
    color: #263149;
}

h1 span {
    color: #8094ed;
}

.subtitle {
    color: #7c879b;
    font-size: 16px;
    line-height: 1.8;
    max-width: 600px;
}

/* MAIN */

main {
    max-width: 1050px;
    margin: auto;
    padding: 20px 25px 80px;
}

/* GRID */

.topics {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 22px;
}

/* CARD */

.card {
    display: block;
    background: #ffffff;
    border: 1px solid #e7eaf1;
    border-radius: 20px;
    padding: 30px;
    text-decoration: none;
    color: inherit;
    box-shadow: 0 4px 15px rgba(30, 45, 80, 0.03);
    transition: all 0.25s ease;
}

.card:hover {
    transform: translateY(-5px);
    box-shadow: 0 12px 28px rgba(30, 45, 80, 0.08);
    border-color: #d4dcfa;
}

/* ICON */

.icon-box {
    width: 55px;
    height: 55px;
    border-radius: 15px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 22px;
    margin-bottom: 22px;
}

.blue {
    background: #e9eeff;
}

.green {
    background: #e1f5ed;
}

.orange {
    background: #fff1df;
}

.purple {
    background: #f3e8fb;
}

.pink {
    background: #fde9f0;
}

.cyan {
    background: #e1f5fa;
}

/* TEXT */

.category {
    font-size: 11px;
    letter-spacing: 1.8px;
    font-weight: 700;
    margin-bottom: 10px;
    text-transform: uppercase;
}

.card h2 {
    font-size: 22px;
    margin-bottom: 12px;
    color: #263149;
}

.card p {
    color: #8490a4;
    font-size: 14px;
    line-height: 1.8;
    min-height: 50px;
}

/* LINK */

.more {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    margin-top: 25px;
    color: #6478d3;
    font-size: 14px;
    font-weight: 600;
}

.arrow {
    transition: transform 0.2s ease;
}

.card:hover .arrow {
    transform: translate(4px, -4px);
}

/* FOOTER */

footer {
    border-top: 1px solid #e7eaf1;
    text-align: center;
    padding: 25px;
    color: #a0a9b8;
    font-size: 12px;
}

/* MOBILE */

@media (max-width: 650px) {
    header {
        padding-top: 55px;
    }

    .topics {
        grid-template-columns: 1fr;
    }

    h1 {
        letter-spacing: -2px;
    }

    .card {
        padding: 25px;
    }
}
</style>
</head>

<body>

<header>
    <div class="tag">WIKI</div>

    <h1>Campagna Nuova<span>.</span></h1>
     <p class="subtitle">
        Avrà un nome vero prima o poi
    </p>
</header>

<main>
    <div class="topics">

        <a href="noname/map.html" target="_blank" class="card">
            <div class="icon-box blue"> 🌏 </div>
            <h2>Mappa Mondo</h2>
        </a>
        <a href="noname/city.html" target="_blank" class="card">
            <div class="icon-box green"> 🏘️ </div>
            <h2>Città</h2>
        </a>
        <a href="noname/pg.html" target="_blank" class="card">
            <div class="icon-box purple"> 🧚🏻‍♂️ </div>
            <h2>Personaggi</h2>
        </a>
         <a href="noname/npc.html" target="_blank" class="card">
            <div class="icon-box cyan"> 🧝🏻‍♂️ </div>
            <h2>NPC</h2>
        </a>
    </div>
</main>



</body>
</html>
